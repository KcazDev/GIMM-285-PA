<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Construction Estimates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <h1>Generate New Estimate</h1>
    <div id='error_banner' class='error-banner' style='display:none;'></div>
    <div id='success_banner' class='success-banner' style='display:none;'></div>
    <div class="container">

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Project Name</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_project_name' type='text' />
                <div id='error_project_name' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Project Type</label>
            </div>
            <div class='col-md-10'>
                <select id='insert_project_type'>
                    <option value=''>-- Select Type --</option>
                    <option value='Residential Home'>Residential Home</option>
                    <option value='Commercial Building'>Commercial Building</option>
                    <option value='Garage'>Garage</option>
                    <option value='Warehouse'>Warehouse</option>
                    <option value='Shed'>Shed</option>
                    <option value='Addition'>Addition</option>
                    <option value='Renovation'>Renovation</option>
                </select>
                <div id='error_project_type' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Location</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_location' type='text' />
                <div id='error_location' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Length (ft)</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_length' type='number' />
                <div id='error_length' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Width (ft)</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_width' type='number' />
                <div id='error_width' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Height (ft)</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_height' type='number' />
                <div id='error_height' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Material</label>
            </div>
            <div class='col-md-10'>
                <select id='insert_materials'>
                    <option value=''>-- Select Material --</option>
                    <option value='wood'>Wood</option>
                    <option value='steel'>Steel</option>
                    <option value='concrete'>Concrete</option>
                    <option value='brick'>Brick</option>
                </select>
                <div id='error_materials' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Load Type</label>
            </div>
            <div class='col-md-10'>
                <select id='insert_load_type'>
                    <option value=''>-- Select Load Type --</option>
                    <option value='static'>Static</option>
                    <option value='dynamic'>Dynamic</option>
                </select>
                <div id='error_load_type' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Cost Per Unit ($)</label>
            </div>
            <div class='col-md-10'>
                <input id='insert_cost_per_unit' type='number' />
                <div id='error_cost_per_unit' class='error-message'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <button id='insert'>Generate Estimate</button>
                <button onclick="location.href='index.html'">View Current Estimates</button>
            </div>
        </div>

    </div>
    <hr />
    <script>
        //Custom method for FETCH API functionality 
        const fetchMethod = (url, fetchParameters, callback) => {
            fetch(url, fetchParameters)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                    ));
                })
                .then(({status, json}) => {
                    callback(status, json);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        };

        document.getElementById('insert').addEventListener('click', (event) => {
            const formData = new FormData();

            if (document.getElementById('insert_project_name').value.length !== 0) {
                formData.append('project_name', document.getElementById('insert_project_name').value);
            }
            if (document.getElementById('insert_project_type').value.length !== 0) {
                formData.append('project_type', document.getElementById('insert_project_type').value);
            }
            if (document.getElementById('insert_location').value.length !== 0) {
                formData.append('location', document.getElementById('insert_location').value);
            }
            if (document.getElementById('insert_length').value.length !== 0) {
                formData.append('length', document.getElementById('insert_length').value);
            }
            if (document.getElementById('insert_width').value.length !== 0) {
                formData.append('width', document.getElementById('insert_width').value);
            }
            if (document.getElementById('insert_height').value.length !== 0) {
                formData.append('height', document.getElementById('insert_height').value);
            }
            if (document.getElementById('insert_materials').value.length !== 0) {
                formData.append('materials', document.getElementById('insert_materials').value);
            }
            if (document.getElementById('insert_load_type').value.length !== 0) {
                formData.append('load_type', document.getElementById('insert_load_type').value);
            }
            if (document.getElementById('insert_cost_per_unit').value.length !== 0) {
                formData.append('cost_per_unit', document.getElementById('insert_cost_per_unit').value);
            }

            fetchMethod(
                '/estimates/',
                {method: 'POST', body: formData},
                (status, json) => {
                    //clear all previous errors and banners first
                    document.querySelectorAll('.error-message').forEach(div => div.textContent = '');
                    document.getElementById('error_banner').style.display = 'none';
                    document.getElementById('error_banner').textContent = '';
                    document.getElementById('success_banner').style.display = 'none';
                    document.getElementById('success_banner').textContent = '';

                    if (200 === status) {
                        document.getElementById('success_banner').style.display = 'block';
                        document.getElementById('success_banner').textContent = '✓ Estimate generated and saved successfully!';
                    } else if (400 === status) {
                        document.getElementById('error_banner').style.display = 'block';
                        document.getElementById('error_banner').textContent = 'Please fix the errors below.';

                        json.errors.forEach(error => {
                            const errorDiv = document.getElementById('error_' + error.path);
                            if (errorDiv) {
                                errorDiv.textContent = error.msg;
                            }
                        });
                    }
                }
            );
        });
    </script>
</body>
</html>
